<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô phỏng: Hai tam giác bằng nhau</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            /* Prevent scrolling for full-screen projection */
            overflow: hidden; 
        }
        
        /* Smooth Custom Gradients & Shadows */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        /* SVG Animation Styles */
        #paper-left {
            transform-origin: 400px 250px;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .is-folded #paper-left {
            /* Fold effect mimicking 3D */
            transform: scaleX(-1);
            fill: #FDE047; /* Slightly darker to show it's folded over */
        }
        
        #cut-lines {
            transition: opacity 0.5s ease-in-out;
        }

        #scissors-group {
            transition: transform 1.5s ease-in-out, opacity 0.3s;
            transform-origin: center;
        }

        #tri-1, #tri-2 {
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .fade-transition {
            transition: opacity 0.5s ease-in-out;
        }

        /* Custom Button Styles */
        .btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn:active:not(:disabled) {
            transform: scale(0.95);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            filter: grayscale(100%);
        }

        /* Quiz Feedback Animation */
        @keyframes popIn {
            0% { transform: scale(0.8) translateY(10px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .feedback-anim {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Cute subtle float animation for the mascot */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .floating {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="h-screen w-screen bg-gradient-to-br from-indigo-50 via-blue-50 to-cyan-100 flex flex-col p-3 md:p-5">

    <!-- Header Section (Compact) -->
    <header class="flex-none bg-blue-600 text-white rounded-2xl shadow-lg px-6 py-3 mb-4 flex items-center gap-4 relative overflow-hidden">
        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9IiNmZmYiIGZpbGwtb3BhY2l0eT0iMC4xIi8+PC9zdmc+')] opacity-30"></div>
        <div class="bg-white text-red-500 font-black rounded-full w-12 h-12 flex items-center justify-center shadow-inner text-xl z-10">HĐ1</div>
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight z-10 drop-shadow-md">Hai tam giác bằng nhau</h1>
        <div class="ml-auto bg-blue-500/50 px-4 py-1.5 rounded-full text-blue-100 font-semibold text-sm border border-blue-400/50 z-10 hidden md:block">
            Mô phỏng Trực quan
        </div>
    </header>

    <!-- Main Content Grid (Fills remaining height) -->
    <main class="flex-1 flex flex-col lg:flex-row gap-5 min-h-0">
        
        <!-- LEFT PANEL: Simulation & Canvas -->
        <section class="flex-[3] flex flex-col glass-panel rounded-3xl overflow-hidden border-2 border-white/60 relative">
            
            <!-- Canvas Area (Expands to fit) -->
            <div class="flex-1 bg-white relative flex items-center justify-center overflow-hidden w-full pattern-dots">
                <!-- Decorative background grid -->
                <div class="absolute inset-0" style="background-image: radial-gradient(#e5e7eb 1px, transparent 1px); background-size: 20px 20px; opacity: 0.5;"></div>
                
                <svg viewBox="0 0 800 500" class="w-full h-full drop-shadow-2xl z-10 max-h-full">
                    <defs>
                        <!-- Arrowhead for fold direction -->
                        <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
                            <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#3B82F6" />
                        </marker>
                        
                        <!-- Paper Shadow -->
                        <filter id="paper-shadow" x="-10%" y="-10%" width="130%" height="130%">
                            <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
                        </filter>
                    </defs>

                    <!-- Group 1: Foldable Paper -->
                    <g id="paper-group" class="fade-transition opacity-100" filter="url(#paper-shadow)">
                        <!-- Right half (Base) -->
                        <rect id="paper-right" x="400" y="100" width="200" height="300" fill="#FEF08A" stroke="#CA8A04" stroke-width="2" />
                        
                        <!-- Left half (This folds over to the right) -->
                        <rect id="paper-left" x="200" y="100" width="200" height="300" fill="#FEF08A" stroke="#CA8A04" stroke-width="2" />
                        
                        <!-- Fold instructions overlay -->
                        <g id="fold-indicators" class="fade-transition opacity-100">
                            <!-- Dashed fold line in center -->
                            <line x1="400" y1="80" x2="400" y2="420" stroke="#94A3B8" stroke-width="3" stroke-dasharray="10,10" />
                            <!-- Sweeping arrow from left to right -->
                            <path d="M 280 60 Q 400 0 470 60" fill="none" stroke="#3B82F6" stroke-width="4" marker-end="url(#arrowhead)" />
                        </g>

                        <!-- Cut lines (Appears after folding) -->
                        <g id="cut-lines" class="fade-transition opacity-0">
                            <!-- Dashed lines for cutting a triangle pointing LEFT (<) -->
                            <line x1="600" y1="100" x2="400" y2="250" stroke="#EF4444" stroke-width="4" stroke-dasharray="8,8" />
                            <line x1="600" y1="400" x2="400" y2="250" stroke="#EF4444" stroke-width="4" stroke-dasharray="8,8" />
                        </g>
                    </g>

                    <!-- Group 2: The Cut Triangles -->
                    <g id="triangles-group" class="fade-transition opacity-0 pointer-events-none" filter="url(#paper-shadow)">
                        <!-- Bottom Layer Triangle -->
                        <polygon id="tri-2" points="600,100 400,250 600,400" fill="#FEF08A" stroke="#CA8A04" stroke-width="2.5" stroke-linejoin="round" />
                        
                        <!-- Top Layer Triangle (This one separates and merges back) -->
                        <polygon id="tri-1" points="600,100 400,250 600,400" fill="#FEF08A" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round" />
                    </g>

                    <!-- Animated Scissors -->
                    <g id="scissors-group" class="opacity-0 pointer-events-none" transform="translate(620, 80) rotate(-35)">
                        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="6" cy="6" r="3"></circle>
                            <circle cx="6" cy="18" r="3"></circle>
                            <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
                            <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
                            <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
                        </svg>
                    </g>
                </svg>
            </div>

            <!-- Controls (Bottom of left panel) -->
            <div class="bg-slate-50 border-t border-slate-200 p-4 md:p-6 flex justify-between items-center z-20">
                <button id="btn-prev" class="btn bg-white hover:bg-slate-100 text-slate-700 border-2 border-slate-200 font-bold py-3 px-5 rounded-2xl flex items-center gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                    <span class="hidden sm:inline">Bước trước</span>
                </button>
                
                <!-- Progress Dots -->
                <div class="flex gap-2" id="progress-dots">
                    <div class="w-3 h-3 rounded-full bg-blue-500"></div>
                    <div class="w-3 h-3 rounded-full bg-slate-300"></div>
                    <div class="w-3 h-3 rounded-full bg-slate-300"></div>
                    <div class="w-3 h-3 rounded-full bg-slate-300"></div>
                    <div class="w-3 h-3 rounded-full bg-slate-300"></div>
                </div>

                <button id="btn-next" class="btn bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-2xl shadow-lg shadow-blue-500/30 flex items-center gap-2 text-lg">
                    Tiếp theo
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </button>

                <button id="btn-reset" class="btn bg-red-50 hover:bg-red-100 text-red-500 border-2 border-red-100 font-bold py-3 px-5 rounded-2xl flex items-center gap-2 hidden">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Làm lại
                </button>
            </div>
        </section>

        <!-- RIGHT PANEL: Instructions & Quiz -->
        <section class="flex-[2] flex flex-col gap-4 min-h-0">
            
            <!-- Instruction Box (Fixed height/flex-shrink) -->
            <div class="glass-panel p-6 rounded-3xl border-l-8 border-l-yellow-400 shrink-0 relative overflow-hidden flex items-center min-h-[140px]">
                <div class="absolute right-[-20px] bottom-[-20px] opacity-10">
                    <svg width="120" height="120" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 22h20L12 2zm0 4.5l7 14H5l7-14z"/></svg>
                </div>
                <p id="instruction-text" class="text-xl lg:text-2xl text-slate-800 font-bold leading-snug w-full">
                    <!-- Text injected by JS -->
                </p>
            </div>

            <!-- Quiz Section (Expands to fill remaining right space) -->
            <div id="quiz-section" class="glass-panel rounded-3xl p-1 shadow-lg border-2 border-emerald-100 flex-1 flex-col overflow-hidden hidden">
                <div class="bg-emerald-50 w-full h-full rounded-[1.35rem] p-5 lg:p-6 flex flex-col relative overflow-y-auto">
                    
                    <!-- Decorative Mascot -->
                    <div class="absolute top-4 right-4 floating opacity-90">
                        <svg width="60" height="60" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="50" cy="50" r="45" fill="#10B981" stroke="#059669" stroke-width="4"/>
                            <circle cx="35" cy="40" r="6" fill="white"/>
                            <circle cx="65" cy="40" r="6" fill="white"/>
                            <path d="M35 65 Q50 80 65 65" stroke="white" stroke-width="6" stroke-linecap="round" fill="none"/>
                            <path d="M30 25 Q40 15 50 25" stroke="#059669" stroke-width="4" stroke-linecap="round" fill="none"/>
                            <path d="M70 25 Q60 15 50 25" stroke="#059669" stroke-width="4" stroke-linecap="round" fill="none"/>
                        </svg>
                    </div>

                    <h3 class="text-xl lg:text-2xl font-extrabold text-emerald-800 mb-5 pr-16 leading-tight">
                        Phần được cắt ra là hai tam giác <span class="text-rose-500 bg-rose-100 px-2 py-1 rounded-lg border border-rose-200">"chồng khít"</span> lên nhau. Theo em:
                    </h3>
                    
                    <div class="flex-1 flex flex-col gap-4">
                        <!-- Question 1 -->
                        <div class="bg-white p-4 lg:p-5 rounded-2xl shadow-sm border border-slate-100">
                            <p class="text-lg font-bold text-slate-800 mb-3">1. Các cạnh tương ứng có bằng nhau không?</p>
                            <div class="flex gap-3">
                                <button onclick="checkAnswer(1, true)" class="btn flex-1 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-bold py-2.5 px-4 rounded-xl border-2 border-emerald-200">Có</button>
                                <button onclick="checkAnswer(1, false)" class="btn flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2.5 px-4 rounded-xl border-2 border-slate-200">Không</button>
                            </div>
                            <div id="feedback-1" class="hidden mt-3 p-3 rounded-xl text-base font-semibold feedback-anim shadow-inner"></div>
                        </div>

                        <!-- Question 2 -->
                        <div class="bg-white p-4 lg:p-5 rounded-2xl shadow-sm border border-slate-100">
                            <p class="text-lg font-bold text-slate-800 mb-3">2. Các góc tương ứng có bằng nhau không?</p>
                            <div class="flex gap-3">
                                <button onclick="checkAnswer(2, true)" class="btn flex-1 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-bold py-2.5 px-4 rounded-xl border-2 border-emerald-200">Có</button>
                                <button onclick="checkAnswer(2, false)" class="btn flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2.5 px-4 rounded-xl border-2 border-slate-200">Không</button>
                            </div>
                            <div id="feedback-2" class="hidden mt-3 p-3 rounded-xl text-base font-semibold feedback-anim shadow-inner"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Empty state filler before quiz shows -->
            <div id="quiz-placeholder" class="glass-panel rounded-3xl flex-1 flex items-center justify-center border-2 border-dashed border-slate-300 opacity-60">
                <p class="text-slate-400 font-bold text-lg text-center px-8">Khu vực trả lời câu hỏi<br><span class="text-sm font-normal">Sẽ xuất hiện ở bước cuối cùng</span></p>
            </div>

        </section>
    </main>

    <script>
        // DOM Elements
        const instructionText = document.getElementById('instruction-text');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnReset = document.getElementById('btn-reset');
        
        // SVG Elements
        const paperGroup = document.getElementById('paper-group');
        const foldIndicators = document.getElementById('fold-indicators');
        const cutLines = document.getElementById('cut-lines');
        const trianglesGroup = document.getElementById('triangles-group');
        const tri1 = document.getElementById('tri-1');
        const tri2 = document.getElementById('tri-2');
        const scissors = document.getElementById('scissors-group');
        
        // UI Layout Elements
        const quizSection = document.getElementById('quiz-section');
        const quizPlaceholder = document.getElementById('quiz-placeholder');
        const progressDots = document.getElementById('progress-dots').children;

        let currentStep = 0;

        const steps = [
            {
                // Step 0: Initial State
                text: "<span class='text-blue-600'>Bước 1:</span> Chuẩn bị một tờ giấy hình chữ nhật. Chú ý nếp gấp nét đứt ở giữa.",
                execute: () => {
                    paperGroup.classList.remove('is-folded');
                    paperGroup.style.opacity = '1';
                    
                    foldIndicators.style.opacity = '1';
                    cutLines.style.opacity = '0';
                    scissors.style.opacity = '0';
                    
                    trianglesGroup.style.opacity = '0';
                    tri1.style.transform = 'translate(0, 0) rotate(0deg)';
                    tri2.style.transform = 'translate(0, 0)';
                    
                    hideQuiz();
                }
            },
            {
                // Step 1: Fold
                text: "<span class='text-blue-600'>Bước 2:</span> Gấp mép bên trái tờ giấy sang bên phải đè lên nhau.",
                execute: () => {
                    paperGroup.classList.add('is-folded');
                    paperGroup.style.opacity = '1';
                    
                    foldIndicators.style.opacity = '0';
                    scissors.style.opacity = '0';
                    
                    // Delay showing cut lines until fold finishes
                    setTimeout(() => {
                        if (currentStep === 1) cutLines.style.opacity = '1';
                    }, 800);
                    
                    trianglesGroup.style.opacity = '0';
                    hideQuiz();
                }
            },
            {
                // Step 2: Cut lines and Scissors
                text: "<span class='text-blue-600'>Bước 3:</span> Dùng kéo cắt theo đường nét đứt thành hình tam giác.",
                execute: () => {
                    paperGroup.classList.add('is-folded');
                    paperGroup.style.opacity = '1';
                    cutLines.style.opacity = '1';
                    trianglesGroup.style.opacity = '0';
                    
                    // Animate scissors cutting along the lines
                    scissors.style.opacity = '1';
                    scissors.style.transform = 'translate(620px, 80px) rotate(-35deg)'; // Start top right
                    
                    setTimeout(() => {
                        if (currentStep !== 2) return;
                        // Move to middle left
                        scissors.style.transform = 'translate(380px, 230px) rotate(-35deg)';
                        
                        setTimeout(() => {
                            if (currentStep !== 2) return;
                            // Move to bottom right
                            scissors.style.transform = 'translate(620px, 420px) rotate(20deg)';
                            
                            setTimeout(() => {
                                if (currentStep !== 2) return;
                                // Hide paper, show cut triangles
                                paperGroup.style.opacity = '0';
                                scissors.style.opacity = '0';
                                trianglesGroup.style.opacity = '1';
                            }, 1000);
                        }, 1200);
                    }, 100);
                    
                    hideQuiz();
                }
            },
            {
                // Step 3: Separate and Overlap
                text: "<span class='text-blue-600'>Bước 4:</span> Tách hai lớp giấy vừa cắt, ta được hai tam giác. Chập chúng lại, ta thấy chúng <span class='text-rose-500 font-black'>chồng khít</span> lên nhau.",
                execute: () => {
                    paperGroup.style.opacity = '0';
                    cutLines.style.opacity = '0';
                    scissors.style.opacity = '0';
                    trianglesGroup.style.opacity = '1';
                    
                    // Separate horizontally and slightly rotate for visual effect
                    tri1.style.transform = 'translate(-220px, -20px) rotate(-5deg)';
                    
                    // Auto slide back to overlap
                    setTimeout(() => {
                        if (currentStep >= 3) {
                            tri1.style.transform = 'translate(0, 0) rotate(0deg)';
                        }
                    }, 2200);
                    
                    hideQuiz();
                }
            },
            {
                // Step 4: Quiz
                text: "<span class='text-emerald-600 font-extrabold'>Hoạt động:</span> Dựa vào quan sát hai tam giác 'chồng khít', em hãy trả lời các câu hỏi bên cạnh 👉",
                execute: () => {
                    // Ensure perfectly overlapped
                    paperGroup.style.opacity = '0';
                    trianglesGroup.style.opacity = '1';
                    tri1.style.transform = 'translate(0, 0) rotate(0deg)';
                    
                    showQuiz();
                }
            }
        ];

        function hideQuiz() {
            quizSection.classList.add('hidden');
            quizSection.classList.remove('flex');
            quizPlaceholder.classList.remove('hidden');
            quizPlaceholder.classList.add('flex');
        }

        function showQuiz() {
            quizSection.classList.remove('hidden');
            quizSection.classList.add('flex');
            quizPlaceholder.classList.add('hidden');
            quizPlaceholder.classList.remove('flex');
            resetQuiz();
        }

        function updateDots() {
            Array.from(progressDots).forEach((dot, index) => {
                if (index === currentStep) {
                    dot.className = 'w-3 h-3 rounded-full bg-blue-600 scale-125 transition-all';
                } else if (index < currentStep) {
                    dot.className = 'w-3 h-3 rounded-full bg-blue-400 transition-all';
                } else {
                    dot.className = 'w-3 h-3 rounded-full bg-slate-200 transition-all';
                }
            });
        }

        // Update UI based on current step
        function renderStep() {
            // Execute animations
            steps[currentStep].execute();
            
            // Update text
            instructionText.innerHTML = steps[currentStep].text;
            
            // Update dots
            updateDots();
            
            // Update buttons
            btnPrev.disabled = currentStep === 0;
            
            if (currentStep === steps.length - 1) {
                btnNext.classList.add('hidden');
                btnReset.classList.remove('hidden');
            } else {
                btnNext.classList.remove('hidden');
                btnReset.classList.add('hidden');
            }
        }

        // Event Listeners
        btnNext.addEventListener('click', () => {
            if (currentStep < steps.length - 1) {
                currentStep++;
                renderStep();
            }
        });

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnReset.addEventListener('click', () => {
            currentStep = 0;
            renderStep();
        });

        // Quiz Logic
        function checkAnswer(questionNum, isYes) {
            const feedbackEl = document.getElementById(`feedback-${questionNum}`);
            // Reset classes
            feedbackEl.className = 'mt-3 p-3 rounded-xl text-base font-semibold feedback-anim shadow-inner block';
            
            // Force reflow to restart animation
            void feedbackEl.offsetWidth; 

            if (isYes) {
                // Correct answer
                feedbackEl.classList.add('bg-emerald-100', 'text-emerald-800', 'border-2', 'border-emerald-300');
                if (questionNum === 1) {
                    feedbackEl.innerHTML = '🎉 <strong>Chính xác!</strong> Vì hai tam giác chồng khít lên nhau nên các mép giấy trùng nhau hoàn toàn, do đó các cạnh tương ứng bằng nhau.';
                } else {
                    feedbackEl.innerHTML = '🎉 <strong>Chính xác!</strong> Khi chồng khít, các góc của hai tam giác cũng khớp nhau hoàn toàn nên các góc tương ứng bằng nhau.';
                }
            } else {
                // Incorrect answer
                feedbackEl.classList.add('bg-rose-50', 'text-rose-700', 'border-2', 'border-rose-300');
                feedbackEl.innerHTML = '💡 <strong>Chưa đúng.</strong> Em hãy nhìn lại lúc 2 tam giác chập vào nhau nhé. Không có phần giấy nào bị thừa ra hay hụt đi, mọi thứ đều vừa vặn. Hãy chọn lại!';
            }
        }

        function resetQuiz() {
            document.getElementById('feedback-1').classList.add('hidden');
            document.getElementById('feedback-1').classList.remove('block');
            document.getElementById('feedback-2').classList.add('hidden');
            document.getElementById('feedback-2').classList.remove('block');
        }

        // Initialize App
        renderStep();
    </script>
</body>
</html>
